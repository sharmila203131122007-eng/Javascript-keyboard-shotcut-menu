<!DOCTYPE html>
<html>
<head>
    <title>Keyboard Shortcut Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Keyboard Shortcuts</h1>

        <button id="menuBtn">Show Shortcuts</button>

        <div id="shortcutMenu" class="menu">
            <h2>Available Shortcuts</h2>
            <p><b>H</b> - Home</p>
            <p><b>S</b> - Search</p>
            <p><b>Esc</b> - Close Menu</p>
            <p><b>?</b> - Show Shortcuts</p>
        </div>

        <p id="message">Press a keyboard shortcut!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
